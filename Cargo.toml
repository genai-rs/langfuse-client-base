[package]
name = "langfuse-client-base"
version = "0.24.0"
edition = "2021"
authors = ["Tim Van Wassenhove <github@timvw.be>"]
license = "MIT OR Apache-2.0"
description = "Auto-generated Langfuse API client from OpenAPI specification"
repository = "https://github.com/genai-rs/langfuse-client-base"
homepage = "https://github.com/genai-rs/langfuse-client-base"
documentation = "https://docs.rs/langfuse-client-base"
readme = "README.md"
exclude = ["docs/", "guides/", "openapi.yml", "scripts/", "tests/*.py", ".github/", "AUTOMATION_GUIDE.md"]
keywords = ["langfuse", "openapi", "client", "api", "llm"]
categories = ["api-bindings", "web-programming::http-client"]
rust-version = "1.88"

[package.metadata.docs.rs]
# Build with default features (rustls). Keep builds deterministic on docs.rs
features = ["rustls"]
no-default-features = false
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bon = "3.10.3"
serde = { version = "^1.0.229", features = ["derive"] }
serde_with = { version = "^3.24.0", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0.154"
serde_repr = "^0.1.21"
url = "^2.5.8"
timvw-rust-runtime = { version = "^0.4.0", default-features = false }

chrono = { version = "^0.4.45",  features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
wiremock = "0.6.5"

[features]
default = ["rustls", "retry"]
rustls = ["timvw-rust-runtime/rustls"]
native-tls = ["timvw-rust-runtime/native-tls"]
# Retries of 429, 408, 5xx and failed connections in the default client (Configuration::new()).
retry = ["timvw-rust-runtime/retry"]
# timvw_rust_runtime::trace::TraceLayer: logs each request and retry with `tracing`.
tracing = ["timvw-rust-runtime/tracing"]

[lints.rust]
# timvw-rust 0.14.0 writes the tag-dispatch helpers `Attempt` and `first_of`
# into src/models/union_dispatch.rs whether or not a union uses them; no
# Langfuse union does. Revisit once the generator marks them unused-allowed.
dead_code = "allow"

[lints.clippy]
# Allow all clippy warnings for generated code
all = "allow"
pedantic = "allow"
restriction = "allow"
nursery = "allow"
cargo = "allow"
