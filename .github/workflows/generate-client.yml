name: Generate Client

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      publish:
        description: Create or update the generated client PR (main only)
        type: boolean
        required: false
        default: false

concurrency:
  group: generate-client
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install generation dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Test generation compatibility rules
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Generate client
        env:
          UPDATE_SPEC: true
        run: ./scripts/generate-openapi-client.sh

      - name: Verify generated files
        run: |
          test -f src/lib.rs
          test -f Cargo.toml
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build all features
        run: cargo build --all --all-features

      - name: Run tests and doctests
        run: cargo test --all --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Save validated changes
        id: changes
        run: |
          if git diff --quiet &&
            [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git add --intent-to-add --all
          git diff --binary HEAD > generated-client.patch

      - name: Upload validated changes
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-client
          path: generated-client.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      needs.validate.outputs.has_changes == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download validated changes
        uses: actions/download-artifact@v4
        with:
          name: generated-client

      - name: Apply validated changes
        run: git apply --binary generated-client.patch

      # Mint the write token only after validation and patch application pass.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: >-
            chore: update generated client from latest OpenAPI spec
          title: >-
            chore: update generated client from latest OpenAPI spec
          base: main
          add-paths: |
            src/
            Cargo.toml
            docs/
            openapi.yml
          body: |
            ## Auto-generated client update

            This PR updates the generated client from the latest Langfuse
            OpenAPI specification.

            Generation, compatibility fixtures, build, tests, doctests,
            formatting, and Clippy passed in the validation job before this PR
            was created.
          branch: automated/generate-client
          delete-branch: true
          labels: |
            dependencies
            automated
            automerge

      - name: Enable auto-merge for generated PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}"
          --auto --rebase --delete-branch

      - name: Update existing PR branch from main
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const head = 'automated/generate-client';
            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                base: 'main',
                head: `${owner}:${head}`
              }
            );
            if (!prs.length) {
              core.info('No open PR for automated/generate-client.');
              return;
            }
            try {
              await github.rest.pulls.updateBranch({
                owner,
                repo,
                pull_number: prs[0].number
              });
              core.info('Branch update triggered.');
            } catch (e) {
              core.warning(`Update not needed or failed: ${e.message}`);
            }

  keepalive:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keepalive Workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = 'generate-client.yml';
            const workflow = await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id
            });
            core.info(
              `Workflow ${workflow.data.name} is ${workflow.data.state}`
            );
            if (workflow.data.state === 'disabled_inactivity') {
              await github.rest.actions.enableWorkflow({
                owner,
                repo,
                workflow_id
              });
              core.info('Workflow re-enabled');
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              per_page: 1
            });
            if (runs.data.workflow_runs.length > 0) {
              const lastRun = runs.data.workflow_runs[0];
              core.info(
                `Last run: ${lastRun.created_at} - Status: ${lastRun.status}`
              );
            }
