name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at midnight UTC

permissions:
  contents: read

jobs:
  security:
    uses: genai-rs/.github/.github/workflows/rust-security.yml@main
    with:
      # The previous workflow had no CodeQL or gitleaks; enable them via the shared defaults.
      run-codeql: true
      run-gitleaks: true
    secrets: inherit
