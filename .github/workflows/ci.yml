name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: genai-rs/.github/.github/workflows/rust-ci.yml@main
    with:
      msrv: "1.88"
      generated-crate: true
      os-matrix: '["ubuntu-latest"]'
    secrets: inherit

  python-tests:
    name: Generation compatibility tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test generation compatibility rules
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 -m unittest discover -s tests -p 'test_*.py'

  public-api:
    name: Public API check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags are needed to find the last release
      - name: Check public API against the last release
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Strict only for PRs that change the generation pipeline: those must
          # reproduce the released API or justify the diff. Spec-driven
          # regeneration PRs are expected to move the API and are reviewed via
          # the api-change report of generate-client.yml, so they only get a
          # report here (as do pushes to main).
          if [ -z "$BASE" ] || git diff --quiet "$BASE...HEAD" -- scripts/ migration/ .github/workflows/generate-client.yml; then
            export ALLOW_API_CHANGES=1
            echo "::notice::Generation pipeline unchanged; public-API diff is report-only"
          fi
          scripts/check_public_api.sh
      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-api-diff
          path: target/reports/public-api-diff.json
          if-no-files-found: ignore
